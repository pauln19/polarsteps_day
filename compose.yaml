services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: polarsteps
      POSTGRES_USER: polarsteps
      POSTGRES_PASSWORD: polarsteps
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [ 'CMD-SHELL', 'pg_isready -U polarsteps -d polarsteps' ]
      interval: 2s
      timeout: 3s
      retries: 15

  lgtm:
    image: grafana/otel-lgtm:latest
    profiles: [ 'observability' ]
    ports:
      - '3000:3000'
      - '4317:4317'
      - '4318:4318'
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: 'true'

volumes:
  postgres-data:
